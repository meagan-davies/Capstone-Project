[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-prosthetic-embodiment"
version = "0.1.0"
description = "Real-time prosthetic control and embodiment quantification system"
authors = [
    { name = "Meagan Davies" }
]
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "prosthetic_control*", "embodiment_model*"]